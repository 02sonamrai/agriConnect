# Server configuration
server.port=8080
server.servlet.context-path=

# Local developer overrides are ignored by Git; set environment properties for deployment.
spring.config.import=optional:file:./application-local.properties

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agriconnect_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${AGRICONNECT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (for Phase 2 security implementation)
agriconnect.jwt.secret=${AGRICONNECT_JWT_SECRET:}
agriconnect.jwt.expiration-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
